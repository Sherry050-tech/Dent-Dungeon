# Docker Compose configuration will be added during local setup.
services:

  db:
    image: pgvector/pgvector:pg16
    container_name: dent-dungeon-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dent_dungeon}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dent_dungeon}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api

    container_name: dent-dungeon-api
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    working_dir: /app

    command:
      [
        "python",
        "-c",
        "print('Dent-Dungeon API container ready for B2')"
      ]

volumes:
  postgres_data: